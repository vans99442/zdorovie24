<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recerptizdorovia.hostmyhtml.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --neutral-200: #E5E5E5;
            --neutral-400: #A3A3A3;
            --neutral-500: #737373;
            --neutral-800: #262626;
            --neutral-900: #171717;
        }

        body {
            min-height: 100vh;
            background: var(--white);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--neutral-900);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .label {
            font-size: 12px;
            font-weight: 400;
            color: var(--neutral-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 48px;
            font-weight: 500;
            color: var(--neutral-800);
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .description {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--neutral-500);
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            color: var(--white);
            background: var(--black);
            border-radius: 4px;
            transition: opacity 150ms cubic-bezier(0.0, 0, 0.2, 1);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 64px;
            padding-top: 24px;
            border-top: 1px solid var(--neutral-200);
        }

        .footer a {
            color: var(--neutral-900);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.02em;
            transition: opacity 150ms cubic-bezier(0.0, 0, 0.2, 1);
        }

        .footer a:hover {
            opacity: 0.7;
        }

        .footer a span {
            color: var(--neutral-400);
            margin-left: 1px;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">Available</div>
        <h1>recerptizdorovia.hostmyhtml.com</h1>
        <p class="description">This subdomain is available. Claim it now.</p>
        <a href="https://rehost.it" class="btn">Get Started</a>

        <div class="footer">
            <a href="https://rehost.it">Rehost It<span>!</span></a>
        </div>
    </div>
</body>
</html>
